<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c15"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded rect -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  <rect width="190" height="190" x="1" y="1" rx="39" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6"/>

  <!-- Grid glow effect -->
  <line x1="20" y1="150" x2="172" y2="150" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="30" y1="160" x2="162" y2="160" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>

  <!-- Stylized Kenyan Matatu / Express Bus Front -->
  <g transform="translate(36, 32)">
    <!-- Bus Body Shell -->
    <rect x="10" y="10" width="100" height="85" rx="18" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="3"/>
    
    <!-- Windshield -->
    <rect x="20" y="22" width="80" height="32" rx="8" fill="#090c15" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Windshield reflection -->
    <line x1="28" y1="46" x2="48" y2="28" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="42" y1="48" x2="62" y2="30" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Destination / Sacco Route Signboard -->
    <rect x="35" y="14" width="50" height="6" rx="2" fill="url(#neonPink)"/>

    <!-- Dual Headlights -->
    <circle cx="26" cy="74" r="7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="94" cy="74" r="7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- LED Daytime running strip -->
    <line x1="18" y1="65" x2="34" y2="65" stroke="#38bdf8" stroke-width="2"/>
    <line x1="86" y1="65" x2="102" y2="65" stroke="#38bdf8" stroke-width="2"/>

    <!-- Front Grille & Kenya Plate -->
    <rect x="42" y="70" width="36" height="15" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="47" y="74" width="26" height="7" rx="2" fill="#fef08a"/>
    <text x="60" y="79.5" font-family="monospace" font-size="4.5" font-weight="900" fill="#000" text-anchor="middle">BUSGO</text>

    <!-- Wheels -->
    <rect x="14" y="94" width="14" height="16" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="92" y="94" width="14" height="16" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Speed lines below -->
  <path d="M 40 148 L 152 148" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
</svg>

