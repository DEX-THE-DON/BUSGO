<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c15"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonPink512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad512)"/>
  <rect width="506" height="506" x="3" y="3" rx="97" fill="none" stroke="url(#neonCyan512)" stroke-width="4" opacity="0.7"/>

  <!-- Synthwave Perspective Floor Grid -->
  <g opacity="0.25" stroke="#06b6d4" stroke-width="2">
    <line x1="56" y1="410" x2="456" y2="410"/>
    <line x1="86" y1="436" x2="426" y2="436"/>
    <line x1="120" y1="458" x2="392" y2="458"/>
    <line x1="160" y1="476" x2="352" y2="476"/>
    <line x1="256" y1="390" x2="256" y2="490"/>
    <line x1="256" y1="390" x2="160" y2="490"/>
    <line x1="256" y1="390" x2="352" y2="490"/>
    <line x1="256" y1="390" x2="70" y2="490"/>
    <line x1="256" y1="390" x2="442" y2="490"/>
  </g>

  <!-- Kenyan Matatu / Modern PSV Silhouette -->
  <g transform="translate(106, 80)">
    <!-- Bus Body Shell -->
    <rect x="20" y="20" width="260" height="230" rx="42" fill="#1e293b" stroke="url(#neonCyan512)" stroke-width="7" filter="url(#glow)"/>
    
    <!-- Roof Destination Sign -->
    <rect x="80" y="32" width="140" height="18" rx="6" fill="url(#neonPink512)"/>
    <text x="150" y="45.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">NAIROBI CORRIDOR</text>

    <!-- Windshield -->
    <rect x="42" y="60" width="216" height="92" rx="20" fill="#090c15" stroke="#38bdf8" stroke-width="3.5"/>
    <!-- Windshield Reflections -->
    <line x1="60" y1="130" x2="115" y2="75" stroke="#38bdf8" stroke-width="3.5" opacity="0.4"/>
    <line x1="100" y1="134" x2="155" y2="79" stroke="#38bdf8" stroke-width="3.5" opacity="0.4"/>

    <!-- Dual LED Headlights -->
    <circle cx="62" cy="202" r="18" fill="#fef08a" stroke="#eab308" stroke-width="3" filter="url(#glow)"/>
    <circle cx="238" cy="202" r="18" fill="#fef08a" stroke="#eab308" stroke-width="3" filter="url(#glow)"/>
    <!-- Daytime Running Lights -->
    <line x1="42" y1="178" x2="84" y2="178" stroke="#38bdf8" stroke-width="4.5"/>
    <line x1="216" y1="178" x2="258" y2="178" stroke="#38bdf8" stroke-width="4.5"/>

    <!-- Grille with Yellow Kenya Plate -->
    <rect x="100" y="190" width="100" height="38" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="115" y="200" width="70" height="19" rx="5" fill="#facc15"/>
    <text x="150" y="214.5" font-family="monospace" font-size="12" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="1">BUSGO</text>

    <!-- Wheels -->
    <rect x="30" y="246" width="38" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="232" y="246" width="38" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="6">BUSGO</text>
  <text x="256" y="468" font-family="monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="3">KENYA TRANSIT OPS</text>
</svg>

